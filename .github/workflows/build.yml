name: CrystalOSD Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    name: Build (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Install LLVM 23
        shell: pwsh
        run: |
          $name = 'clang+llvm-23.1.2-x86_64-pc-windows-msvc'
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/$name.tar.xz" -OutFile "$env:RUNNER_TEMP/llvm.tar.xz"
          tar -xf "$env:RUNNER_TEMP/llvm.tar.xz" -C "$env:RUNNER_TEMP"
          if (Test-Path 'C:/Program Files/LLVM') { Remove-Item -Recurse -Force 'C:/Program Files/LLVM' }
          Move-Item "$env:RUNNER_TEMP/$name" 'C:/Program Files/LLVM'

      - name: Check the compiler
        shell: pwsh
        run: |
          $version = & 'C:/Program Files/LLVM/bin/clang++.exe' --version | Select-Object -First 1
          $version
          if ($version -notmatch 'clang version 23\.') { throw "expected clang 23, got: $version" }

      - name: Developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset app

      - name: Build
        run: cmake --build --preset app-release
