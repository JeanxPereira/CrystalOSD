<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1436 172" width="1436" height="172" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">How a value enters the code</title><desc id="workflow-desc">A function of the PS2 OSD is read from the disassembly, probed in an instrumented emulator, recomputed bit for bit by a verifier that a mutation must break, stated on a facts page, and ported to C++ under the golden-frame gate.</desc><defs><pattern id="workflow-g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#7f8ea8" stroke-opacity=".07" stroke-width="1"/></pattern><pattern id="workflow-G" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#7f8ea8" stroke-opacity=".13" stroke-width="1"/></pattern></defs><style>
.name{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#c5d0de} .sub{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#8593a6;letter-spacing:.08em}
.eyebrow{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#7f8ea8;letter-spacing:.14em}
