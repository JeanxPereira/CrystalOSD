.sub.focal{fill:#e8954a}
</style><rect width="1436" height="172" rx="10" fill="#0c1117"/><rect width="1436" height="172" rx="10" fill="url(#workflow-g)"/><rect width="1436" height="172" rx="10" fill="url(#workflow-G)"/><rect x=".5" y=".5" width="1435" height="171" rx="10" fill="none" stroke="#7f8ea8" stroke-opacity=".35"/><text class="eyebrow" x="24" y="30">SECTION A · ONE FUNCTION, FROM THE BINARY TO THE CODE</text><rect x="24" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="24" y="52" width="208" height="92" rx="6" fill="#c5d0de" fill-opacity="0.05"/><rect x="24" y="52" width="208" height="92" rx="6" fill="none" stroke="#c5d0de" stroke-opacity="0.6" stroke-width="1.2"/><text class="sub" x="40" y="76">01</text><text class="title" x="40" y="96" style="font-size:15px">Read</text><text x="40" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">asm.mjs, one function</text><text x="40" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">HDD OSD 1.10U</text><line x1="234" y1="98" x2="251" y2="98" stroke="#8593a6" stroke-width="1.2"/><path d="M258 98 L250 94 L250 102 Z" fill="#8593a6"/><rect x="260" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="260" y="52" width="208" height="92" rx="6" fill="#c5d0de" fill-opacity="0.05"/><rect x="260" y="52" width="208" height="92" rx="6" fill="none" stroke="#c5d0de" stroke-opacity="0.6" stroke-width="1.2"/><text class="sub" x="276" y="76">02</text><text class="title" x="276" y="96" style="font-size:15px">Probe</text><text x="276" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">Watson, a short capture</text><text x="276" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">inputs and outputs</text><line x1="470" y1="98" x2="487" y2="98" stroke="#8593a6" stroke-width="1.2"/><path d="M494 98 L486 94 L486 102 Z" fill="#8593a6"/><rect x="496" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="496" y="52" width="208" height="92" rx="6" fill="#e8954a" fill-opacity="0.12"/><rect x="496" y="52" width="208" height="92" rx="6" fill="none" stroke="#e8954a" stroke-opacity="0.9" stroke-width="1.2"/><text class="sub focal" x="512" y="76">03</text><text class="title" x="512" y="96" style="font-size:15px">Recompute</text><text x="512" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">a verifier, bit for bit</text><text x="512" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">on both builds</text><line x1="706" y1="98" x2="723" y2="98" stroke="#8593a6" stroke-width="1.2"/><path d="M730 98 L722 94 L722 102 Z" fill="#8593a6"/><rect x="732" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="732" y="52" width="208" height="92" rx="6" fill="#c5d0de" fill-opacity="0.05"/><rect x="732" y="52" width="208" height="92" rx="6" fill="none" stroke="#c5d0de" stroke-opacity="0.6" stroke-width="1.2"/><text class="sub" x="748" y="76">04</text><text class="title" x="748" y="96" style="font-size:15px">Mutate</text><text x="748" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">change the arithmetic</text><text x="748" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">the verdict must fail</text><line x1="942" y1="98" x2="959" y2="98" stroke="#8593a6" stroke-width="1.2"/><path d="M966 98 L958 94 L958 102 Z" fill="#8593a6"/><rect x="968" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="968" y="52" width="208" height="92" rx="6" fill="#c5d0de" fill-opacity="0.05"/><rect x="968" y="52" width="208" height="92" rx="6" fill="none" stroke="#c5d0de" stroke-opacity="0.6" stroke-width="1.2"/><text class="sub" x="984" y="76">05</text><text class="title" x="984" y="96" style="font-size:15px">State</text><text x="984" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">a facts page</text><text x="984" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">cites its script</text><line x1="1178" y1="98" x2="1195" y2="98" stroke="#8593a6" stroke-width="1.2"/><path d="M1202 98 L1194 94 L1194 102 Z" fill="#8593a6"/><rect x="1204" y="52" width="208" height="92" rx="6" fill="#131a22"/><rect x="1204" y="52" width="208" height="92" rx="6" fill="#c5d0de" fill-opacity="0.05"/><rect x="1204" y="52" width="208" height="92" rx="6" fill="none" stroke="#c5d0de" stroke-opacity="0.6" stroke-width="1.2"/><text class="sub" x="1220" y="76">06</text><text class="title" x="1220" y="96" style="font-size:15px">Port</text><text x="1220" y="116" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">C++ in Source/</text><text x="1220" y="132" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8593a6">golden frames equal</text></svg>
