tools:
  transmuter:
    # Matching compiler: ee-gcc 2.9-991111 (the compiler the original OSDSYS was built
    # with). Set $MATCH_CC to your ee-gcc binary; modern ps2dev GCC will NOT byte-match.
    # WSL note: ee-gcc EOVERFLOWs on /mnt/c (9p mount); compile from native ext4.
    compiler: |
      "${MATCH_CC:?set MATCH_CC to ee-gcc2.9-991111/bin/ee-gcc}" -O2 -G0 -Wall -D_EE -mabi=eabi -mno-abicalls -fno-common -fno-exceptions -I include -c "{{inputPath}}" -o "{{outputPath}}"
